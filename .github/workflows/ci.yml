name: Prism CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ libsdl2-dev python3 python3-pip

    - name: Configure CMake (Release)
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release \
          -DPRISM_BUILD_TESTS=ON \
          -DPRISM_BUILD_APPS=ON \
          -DPRISM_WARNINGS_AS_ERRORS=ON

    - name: Build All Targets
      run: cmake --build build -j$(nproc)

    - name: Run Unit Tests
      run: ctest --test-dir build --output-on-failure

    - name: Run Headless Demos
      run: |
        ./build/apps/wireframe_demo --headless 5
        ./build/apps/rasterizer_demo --headless 5
        ./build/apps/dungeon_crawler --headless 5
        ./build/apps/benchmark

  sanitizers:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ libsdl2-dev

    - name: Configure CMake (ASan + UBSan)
      run: |
        cmake -B build-san -DCMAKE_BUILD_TYPE=Debug \
          -DPRISM_BUILD_TESTS=ON \
          -DPRISM_BUILD_APPS=ON \
          -DPRISM_WARNINGS_AS_ERRORS=ON \
          -DPRISM_ENABLE_ASAN=ON \
          -DPRISM_ENABLE_UBSAN=ON

    - name: Build Sanitizer Targets
      run: cmake --build build-san -j$(nproc)

    - name: Run Tests with Sanitizers
      env:
        ASAN_OPTIONS: "detect_leaks=1:abort_on_error=1"
        UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
      run: ctest --test-dir build-san --output-on-failure
